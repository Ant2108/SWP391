spring:
  application:
    name: storage-api

  # Tự động đọc file .env ở thư mục hiện tại hoặc thư mục cha (D:\SWP391\.env)
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:../../../.env[.properties]

  # Giới hạn dung lượng upload: tối đa 5MB mỗi ảnh.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # =========================
  # DATABASE
  # =========================
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=storageDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:12345}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # =========================
  # JPA / HIBERNATE
  # =========================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # =========================
  # MAIL
  # =========================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:safespace.demo@gmail.com}
    password: ${MAIL_PASSWORD:demo-app-password}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # =========================
  # GOOGLE OAUTH2
  # =========================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:demo-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:demo-google-client-secret}
            scope:
              - openid
              - profile
              - email

# =========================
# JWT
# =========================
jwt:
  secret: ${JWT_SECRET:c3dwMzkxLXNhZmVzcGFjZS1zdG9yYWdlLWRlZmF1bHQtand0LXNlY3JldC1rZXktMjAyNg==}
  expiration: 900000
  refresh-expiration: 604800000

# =========================
# SERVER
# =========================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# =========================
# CORS
# =========================
app:
  # Link trong email (reset password, xác nhận đổi email) trỏ về FE
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  upload:
    # Thư mục lưu ảnh upload (tương đối so với nơi chạy ứng dụng). Có thể đổi bằng biến môi trường UPLOAD_DIR.
    dir: ${UPLOAD_DIR:uploads}
