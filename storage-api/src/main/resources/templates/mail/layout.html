<!DOCTYPE html>
<!--
  Layout chung cho mọi email, đồng bộ với giao diện web (màu vàng #F9B800, nền kem, font Inter, card bo góc).
  Dùng table + inline style vì đa số mail client (Gmail, Outlook) bỏ qua <style> và flex/grid.
  Cách dùng: <html th:replace="~{mail/layout :: layout(~{::#content})}"> ... <div id="content">...</div>
-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light only">
    <title th:text="${subject}">SafeSpace Storage</title>
</head>
<body style="margin:0;padding:0;background:#FFFDF5;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#202938;-webkit-font-smoothing:antialiased;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FFFDF5;">
    <tr>
        <td align="center" style="padding:40px 16px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">

                <!-- Brand -->
                <tr>
                    <td style="padding:0 4px 24px;">
                        <a th:href="${frontendUrl}" href="#" style="text-decoration:none;color:#202938;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td width="44" height="44" align="center" valign="middle"
                                        style="width:44px;height:44px;background:#F9B800;border-radius:12px;font-size:17px;font-weight:600;color:#202938;">SS</td>
                                    <td style="padding-left:12px;font-size:18px;font-weight:500;color:#202938;">SafeSpace Storage</td>
                                </tr>
                            </table>
                        </a>
                    </td>
                </tr>

                <!-- Card -->
                <tr>
                    <td style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:22px;padding:36px 32px;box-shadow:0 1px 2px rgba(32,41,56,.04),0 4px 16px rgba(32,41,56,.05);">
                        <div th:replace="${content}">Content</div>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding:24px 4px 0;font-size:13px;line-height:1.6;color:#687386;">
                        This is an automated message from SafeSpace Storage. Please do not reply to this email.
                        <br>
                        &copy; SafeSpace Storage
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
