<!DOCTYPE html>
<!-- Biến: name, heading, message, link, linkLabel (link/linkLabel có thể null) -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: layout(~{::#content})}">
<body>
<div id="content">
    <div style="font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#B38400;margin:0 0 8px;">Facility updates</div>
    <h1 style="font-size:24px;line-height:1.3;font-weight:600;margin:0 0 16px;color:#202938;" th:text="${heading}">Update</h1>

    <p style="font-size:15px;line-height:1.6;margin:0 0 12px;color:#202938;">
        Hi <strong th:text="${name}">there</strong>,
    </p>
    <p style="font-size:15px;line-height:1.6;margin:0 0 24px;color:#202938;white-space:pre-line;" th:text="${message}">Message</p>

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 8px;" th:if="${link != null}">
        <tr>
            <td style="background:#F9B800;border-radius:14px;">
                <a th:href="${link}" th:text="${linkLabel}" href="#" target="_blank"
                   style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:500;color:#202938;text-decoration:none;border-radius:14px;">View details</a>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
